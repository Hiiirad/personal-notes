# Status bar
set -g status-interval 15
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour150
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%B-%m/%Y #[fg=colour233,bg=colour245,bold] %H:%M '
set -g status-right-length 50
set -g status-left-length 20
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Scrollback size
set -g history-limit 10000
set -g escape-time 10

# Using the mouse to switch panes
set -g mouse on

# Highlight window when it has new activity
set -g monitor-activity on
set -g visual-activity on

# Renumber windows when one is closed
set -g renumber-windows on

# Set the window-option mode keys to vi
setw -g mode-keys vi

# Window number start from 1
set -g base-index 1
setw -g pane-base-index 1

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Keep working directory when splitting windows
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
# Keep working directory when creating a new window
# bind c new-window -c '#{pane_current_path}'

# --- New tmux 3.6 & 3.7 Features ---
# Enable visual scrollbars in copy mode (v3.6+)
set -g pane-scrollbars on

# Enable line numbers in copy mode, great for vi users! (v3.7+)
set -g copy-mode-line-numbers hybrid

# (Optional) Focus a pane just by hovering your mouse over it (v3.7+)
# set -g focus-follows-mouse on

# Rely on modern terminal OSC 52 clipboard rather than xclip
set -s set-clipboard on
